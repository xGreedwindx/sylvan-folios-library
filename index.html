<!DOCTYPE html>

<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"  content="width=device-width,initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Iansui&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="index.css">

    <title>樹冠下的書藏</title>
    <meta name="description" content="一個森林風格的電子圖書館">

    <script src="index.js" defer></script>
  </head>
  
  <body>

    <!-- <header>
      <nav class="">

      </nav>
    </header> -->

    <main class="homepage">
      
      <a href="index.html" id="homepage-logo">
        <img src="https://mfzziekttcmyhiyplwxn.supabase.co/storage/v1/object/public/site-assets/shared-folder/daytime-wooden%20bulletin%20board.webp"
         alt="樹冠下的書藏 Sylvan Folios - 返回主頁"
         id="wooden-board-img"
         class="wooden-board-img pointable-component fit-img"
        >
      </a>


      <button type="button" id="vine-setting" class="pointable-component captioned-figure">
        <img src="https://mfzziekttcmyhiyplwxn.supabase.co/storage/v1/object/public/site-assets/shared-folder/daytime-setting.webp"
         alt=""
         id="vine-img"
         class="vine-img fit-img"
        >
        <span>系統設定</span>
      </button>


      <a href="personal-page.html" id="personal-page-btn">
        <figure class="captioned-figure pointable-component">
          <img src="https://mfzziekttcmyhiyplwxn.supabase.co/storage/v1/object/public/site-assets/index-img/daytime-desk.webp"
           alt=""
           id="desk-img"
           class="desk-img fit-img"
          >
          <figcaption>個人書庫</figcaption>
        </figure>
      </a>


      <a href="searching-books-page.html" id="search-page-btn">
        <figure class="captioned-figure pointable-component">
          <img src="https://mfzziekttcmyhiyplwxn.supabase.co/storage/v1/object/public/site-assets/index-img/daytime-shelf.webp"
           alt=""
           id="search-img"
           class="search-img fit-img"
          >
          <figcaption>檢索書籍</figcaption>
        </figure>
      </a>


      <div class="column-frame" id="left-column" aria-hidden="true">
        <img src="https://mfzziekttcmyhiyplwxn.supabase.co/storage/v1/object/public/site-assets/index-img/daytime-column.webp"
         alt=""
         class="column"
         draggable="false"
         loading="eager"
         decoding="async"
        >
      </div>


      <div id="right-column" class="column-frame" aria-hidden="true">
        <img src="https://mfzziekttcmyhiyplwxn.supabase.co/storage/v1/object/public/site-assets/index-img/daytime-column.webp"
         alt=""
         class="column"
         draggable="false"
         loading="eager"
         decoding="async"
        >
      </div>

    </main>

    <dialog aria-labelledby="welcome-dialog" class="welcome-dialog">

      <h2 id="welcome-dialog"></h2>

      <p></p>

      <form method="dialog">
        <button aria-label="關閉歡迎視窗">X</button>
      </form>

    </dialog>

    <dialog aria-labelledby="settings-title"class="setting-menu">

      <h2 id="settings-title">系統設定</h2>

      <ul>
        <li>
          <button type="button" id="theme-menu-btn">
            <img src="" alt="" class="theme-img">
            <span>切換主題</span>
          </button>
        </li>


        <li>
          <button type="button" id="language-menu-btn" disabled>
            <img src="" alt="" class="language-img">
            <span>切換語言</span>
          </button>
        </li>


        <li>
          <button type="button" id="about-menu-btn" disabled>
            <img src="" alt="" class="about-img">
            <span>使用教學</span>
          </button>
        </li>


        <li>
          <button type="button" id="close-menu-btn">
            <img src="" alt="" class="close-img">
            <span>關閉選單</span>
          </button>
        </li>
      </ul>

    </dialog>
  </body>

</html>
